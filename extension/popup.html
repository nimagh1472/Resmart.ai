<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ReSmart</title>
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #0f172a;
      }
      .brand {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #059669;
        margin: 0 0 10px;
      }
      .vip-banner {
        border: 1px solid #a7f3d0;
        background: linear-gradient(135deg, #ecfdf5, #f0fdfa);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 12px;
      }
      .vip-banner strong {
        font-size: 12px;
        color: #047857;
      }
      .vip-banner p {
        margin: 2px 0 0;
        font-size: 11px;
        color: #64748b;
      }
      .zip-row {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
      }
      .zip-row input {
        flex: 1;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 6px 8px;
        font-size: 12px;
        min-width: 0;
      }
      .zip-row button {
        border: none;
        background: #059669;
        color: #fff;
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .zip-row button:hover {
        background: #047857;
      }
      .title {
        font-size: 13px;
        font-weight: 500;
        margin: 0 0 10px;
        line-height: 1.35;
      }
      .empty {
        font-size: 12px;
        color: #64748b;
        line-height: 1.4;
      }
      .alert {
        border: 1px solid #a7f3d0;
        background: #ecfdf5;
        border-radius: 10px;
        padding: 10px 12px;
      }
      .alert-title {
        margin: 0 0 4px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #047857;
      }
      .alert-body {
        margin: 0 0 2px;
        font-size: 13px;
        font-weight: 500;
      }
      .alert-meta {
        margin: 0 0 8px;
        font-size: 11px;
        color: #64748b;
      }
      .alert a {
        display: inline-block;
        font-size: 12px;
        font-weight: 600;
        color: #059669;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <p class="brand">ReSmart</p>

    <div class="vip-banner">
      <strong>VIP — $4.99/mo intro</strong>
      <p>First 3 months, then $14.99/mo. Priority open-box alerts included.</p>
    </div>

    <div class="zip-row">
      <input id="zip-input" type="text" inputmode="numeric" maxlength="5" placeholder="ZIP code" />
      <button id="zip-save">Save</button>
    </div>

    <div id="root">
      <p class="empty">Loading…</p>
    </div>
    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
