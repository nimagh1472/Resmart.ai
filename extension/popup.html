<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ReSmart VIP</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #0f172a;
      }
      .brand {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #059669;
        margin: 0 0 8px;
      }
      .title {
        font-size: 13px;
        font-weight: 500;
        margin: 0 0 10px;
        line-height: 1.35;
      }
      .empty {
        font-size: 12px;
        color: #64748b;
        line-height: 1.4;
      }
      .alert {
        border: 1px solid #a7f3d0;
        background: #ecfdf5;
        border-radius: 10px;
        padding: 10px 12px;
      }
      .alert-title {
        margin: 0 0 4px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #047857;
      }
      .alert-body {
        margin: 0 0 2px;
        font-size: 13px;
        font-weight: 500;
      }
      .alert-meta {
        margin: 0 0 8px;
        font-size: 11px;
        color: #64748b;
      }
      .alert a {
        display: inline-block;
        font-size: 12px;
        font-weight: 600;
        color: #059669;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <p class="brand">ReSmart VIP</p>
    <div id="root">
      <p class="empty">Loading…</p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
